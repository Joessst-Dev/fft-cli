# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: fft

before:
  hooks:
    # Fail the release rather than ship a binary built from a stale go.sum.
    - go mod download

# Four binaries now, not one. fft is the client; the other three are components — the
# emulator and its two broker transports — which used to be compiled into fft and are
# now shipped alongside it. The split takes roughly a third off the fft download,
# because the cloud SDKs (gRPC for Pub/Sub, AMQP for Service Bus) go with the
# transports that need them.
#
# Every build shares the same flags: no cgo (go-keyring reaches the OS keychain
# through syscalls, not C, so a static binary is portable), -trimpath, and a stamped
# commit date for reproducibility. Only fft carries the buildinfo ldflags — it is the
# one with a `fft version`.
builds:
  - id: fft
    main: ./cmd/fft
    binary: fft
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/Joessst-Dev/fft-cli/internal/buildinfo.Version={{ .Version }}
      - -X github.com/Joessst-Dev/fft-cli/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/Joessst-Dev/fft-cli/internal/buildinfo.Date={{ .CommitDate }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The component binaries. `binary: bin/<name>` puts each one under bin/ inside its
  # archive, which is exactly the layout the manifest's `exec:` names and the installer
  # unpacks — so `fft component install emulator` finds bin/fft-emulator where it looks.
  - id: fft-emulator
    main: ./cmd/fft-emulator
    binary: bin/fft-emulator
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: fft-emulator-pubsub
    main: ./cmd/fft-emulator-pubsub
    binary: bin/fft-emulator-pubsub
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: fft-emulator-servicebus
    main: ./cmd/fft-emulator-servicebus
    binary: bin/fft-emulator-servicebus
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: fft
    ids: [fft]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

  # One archive per component per platform, each carrying its committed component.yaml
  # at the root and its binary under bin/ — the shape `fft component install` verifies
  # against checksums.txt and unpacks. The name is what pickAsset looks for:
  # fft-component-<name>_<version>_<os>_<arch>.
  - id: fft-emulator
    ids: [fft-emulator]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: fft-component-emulator_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - src: components/emulator/component.yaml
        dst: component.yaml

  - id: fft-emulator-pubsub
    ids: [fft-emulator-pubsub]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: fft-component-emulator-pubsub_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - src: components/emulator-pubsub/component.yaml
        dst: component.yaml

  - id: fft-emulator-servicebus
    ids: [fft-emulator-servicebus]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: fft-component-emulator-servicebus_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - src: components/emulator-servicebus/component.yaml
        dst: component.yaml

# Container images. GoReleaser does not rebuild here — the image COPYs the static
# binaries already built above (see Dockerfile). It builds both platforms with buildx
# in one pass; because nothing target-arch runs during the build (only files are
# copied), the arm64 image needs no QEMU on an amd64 runner. GHCR requires a lowercase
# path, hence `joessst-dev` rather than the repo's `Joessst-Dev`.
#
# The image bundles all four binaries: fft plus its first-party components, laid out as
# a component root the image bakes in. So `docker run …/fft emulator --host 0.0.0.0` is
# byte-for-byte what it was before the split — the two Testcontainers modules that drive
# exactly that command line need no change. A brew or tarball user installs the emulator
# component once; an image user has it already.
dockers_v2:
  - id: fft
    ids: [fft, fft-emulator, fft-emulator-pubsub, fft-emulator-servicebus]
    dockerfile: Dockerfile
    # The committed manifests, copied into the build context so the Dockerfile can
    # assemble each component directory (manifest + binary) under the baked root.
    extra_files:
      - components
    images:
      - ghcr.io/joessst-dev/fft
    platforms:
      - linux/amd64
      - linux/arm64
    # An empty tag is skipped, so a prerelease never becomes `docker pull …/fft:latest` —
    # the guard the cask gets from `skip_upload: auto`.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    # Links the GHCR package to this repo and records provenance.
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "A CLI for the fulfillmenttools API — every operation reachable from your shell."
      org.opencontainers.image.source: "https://github.com/Joessst-Dev/fft-cli"
      org.opencontainers.image.url: "https://joessst-dev.github.io/fft-cli/"
      org.opencontainers.image.documentation: "https://joessst-dev.github.io/fft-cli/"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: MIT

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive

# Keyless signing via the GitHub OIDC token: no private key exists to leak, and
# the signature is bound to this repo and this workflow in the public Rekor log.
# fft handles tenant credentials, so a user must be able to prove a binary is ours.
#
# Only checksums.txt is signed (artifacts: checksum), so verification is two steps:
# verify the checksums file's signature, then check the archive against it. This is
# the procedure the install guide's "Verifying a download" documents — do not imply a
# per-archive signature exists; none is produced.
#
# cosign v3 emits a single Sigstore bundle (cert + signature + Rekor entry in one
# .bundle) rather than the split .pem/.sig it deprecated. So one artifact,
# checksums.txt.bundle, and one --bundle flag on verify:
#
#   cosign verify-blob \
#     --bundle checksums.txt.bundle \
#     --certificate-identity-regexp 'https://github.com/Joessst-Dev/fft-cli/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
#   sha256sum --check checksums.txt --ignore-missing
signs:
  - id: cosign-keyless
    cmd: cosign
    artifacts: checksum
    # The bundle is what GoReleaser uploads for this signature, so name it here and
    # point --bundle at the same path.
    signature: "${artifact}.bundle"
    output: true
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# The same keyless bargain for the images: sign the multi-arch manifest by digest so
# `cosign verify ghcr.io/joessst-dev/fft:<tag>` proves an image is ours, exactly as the
# tarball signatures do. Uses the workflow's OIDC token — no key to leak.
docker_signs:
  - id: cosign-image-keyless
    cmd: cosign
    artifacts: manifests
    output: true
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"

changelog:
  # Conventional commits, grouped. `sort: asc` keeps each group in commit order.
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Refactoring
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch

# Homebrew. Note this is `homebrew_casks`, not `brews`: GoReleaser deprecated the
# formula pipe, and `goreleaser check` (a CI gate) fails on deprecated properties.
# Two consequences worth knowing:
#   - Casks are macOS-only. Windows is served by the scoops/winget blocks below;
#     Linux users install via `go install` or the tarball.
#   - Casks have no `test do` block; the install is verified by `brew audit` and by
#     the post-install hook below rather than by running `fft version`.
homebrew_casks:
  - name: fft
    binaries:
      - fft
    ids:
      - fft
    repository:
      owner: Joessst-Dev
      name: homebrew-tap
      branch: main
      # A PAT scoped to the tap repo. The workflow's GITHUB_TOKEN cannot be used:
      # it is scoped to *this* repo and cannot push to Joessst-Dev/homebrew-tap.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/Joessst-Dev/fft-cli
    description: A CLI for the fulfillmenttools API — every operation reachable from your shell.
    license: MIT
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    commit_msg_template: "brew: fft {{ .Tag }}"
    # A prerelease must never become `brew install fft`.
    skip_upload: auto
    # Deliberately no completion stanza. Cobra gives us `fft completion <shell>`, but
    # wiring it into a *cask* is not obviously safe: `completions:` renders
    # `bash_completion "..."`, which Homebrew reads as a path to a file inside the
    # archive (there isn't one), and `generate_completions_from_executable` renders a
    # Formula-only DSL call into a Cask. Neither can be verified without publishing a
    # tap. A cask that fails to install is far worse than one without completions, so
    # the setup guide tells users to run `fft completion <shell>` themselves. Revisit once
    # the tap exists and `brew audit --cask` can adjudicate.
    hooks:
      post:
        # The binaries are signed with cosign, not with an Apple Developer ID, so
        # Gatekeeper would quarantine them on first run. Strip the attribute the
        # way Homebrew itself recommends for unnotarized binaries.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fft"]
          end

# Scoop, the Windows counterpart to the cask above. Same shape and same bargain: fft
# never replaces its own binary (see internal/update), so every upgrade path is a
# package manager's — and Windows had none until this block.
#
# `ids: [fft]` is load-bearing. Seven archives leave this release, and without the
# filter the pipe would try to make a manifest out of fft-component-emulator_*.zip as
# well: a component is installed by `fft component install`, not by scoop.
#
# The manifest points at the windows *zip*, which the archives block above already
# guarantees via format_overrides. Scoop cannot unpack a tar.gz.
scoops:
  - name: fft
    ids: [fft]
    repository:
      owner: Joessst-Dev
      name: scoop-bucket
      branch: main
      # A second fine-grained PAT rather than a widened HOMEBREW_TAP_TOKEN. That one
      # is scoped to the tap repo, so it cannot write here, and widening it would
      # make its name a lie and cost two publishing surfaces per leak instead of one.
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    # Named explicitly rather than left to the default, because which of bucket/ and
    # the repo root the default is has changed across GoReleaser versions — and a
    # manifest in the wrong place makes `scoop bucket list` report 0 manifests
    # instead of failing.
    directory: bucket
    homepage: https://github.com/Joessst-Dev/fft-cli
    description: A CLI for the fulfillmenttools API — every operation reachable from your shell.
    license: MIT
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    commit_msg_template: "scoop: fft {{ .Tag }}"
    # A prerelease must never become `scoop install fft`, exactly as for the cask.
    skip_upload: auto
    # Deliberately no depends/persist/shortcuts/pre_install/post_install, mirroring
    # the cask's minimalism. In particular there is no Scoop equivalent of the cask's
    # xattr hook and none is needed: SmartScreen keys on download reputation, not on
    # an extended attribute, and Scoop's own sha256 check is the integrity control.

# WinGet. Unlike the tap and the bucket, the destination is not ours: manifests live
# in microsoft/winget-pkgs, and the only way in is a pull request from a fork. So
# `repository:` names *our fork* — where GoReleaser pushes a branch — and
# `pull_request.base:` names upstream, where it opens the PR.
#
# The first submission is reviewed by a human at Microsoft and takes days; every one
# after it is mostly automated, provided the manifests keep validating. A manifest
# rejected upstream is fixed by editing the PR — it never requires re-tagging fft.
#
# The installer is the windows zip, consumed as a nested *portable*: winget unpacks
# the archive, finds fft.exe inside it, and aliases it as `fft`, having verified the
# sha256 from checksums.txt first.
winget:
  - name: fft
    package_identifier: Joessst-Dev.fft
    # Same filter, same reason as the scoop block above.
    ids: [fft]

    publisher: Joessst-Dev
    publisher_url: https://github.com/Joessst-Dev
    publisher_support_url: https://github.com/Joessst-Dev/fft-cli/issues

    homepage: https://joessst-dev.github.io/fft-cli/
    license: MIT
    license_url: https://github.com/Joessst-Dev/fft-cli/blob/main/LICENSE

    # ASCII on purpose (- rather than the em dash used everywhere else here): the
    # manifests are UTF-8 and an em dash is legal, but `winget search` renders into
    # consoles with legacy code pages, and upstream validation is fussier about the
    # locale manifest than about anything else. Not worth spending a first review on.
    short_description: A CLI for the fulfillmenttools API - every operation reachable from your shell.
    description: |
      fft is a command-line client for the fulfillmenttools fulfillment API. Sign in
      once, then reach every one of the API's operations from your shell - orders,
      facilities, interfacility connections, listings, stock, pick and pack jobs,
      handovers and routing strategies - not the ones someone got around to wrapping,
      all of them.

      stdout is data and nothing else, so a pipe is always safe. Credentials go to the
      Windows Credential Manager, never to a config file.

      Not an official fulfillmenttools product: an independent, open-source community
      project, not affiliated with or supported by OC fulfillment tools GmbH.
    release_notes_url: "https://github.com/Joessst-Dev/fft-cli/releases/tag/{{ .Tag }}"

    # winget caps tags at 16, 40 characters each, and prefers lowercase.
    tags:
      - cli
      - api
      - api-client
      - fulfillment
      - fulfillmenttools
      - logistics
      - warehouse
      - ecommerce
      - golang

    repository:
      # The bot's fork — not upstream, and not an account of ours. See below on why
      # the token cannot belong to a human's account.
      owner: FFT_WINGET_BOT_ACCOUNT
      name: winget-pkgs
      # One branch per version, so two releases in flight never share a PR head.
      branch: "fft-{{ .Version }}"
      # A classic PAT with `public_repo`, minted on a bot account that is a
      # collaborator nowhere else. Opening a PR whose base is microsoft/winget-pkgs
      # needs `pull_requests: write` on a repository we do not own, and a
      # fine-grained PAT cannot be scoped to that — so the scope is unavoidably broad
      # and the mitigation is that it grants access to an account holding nothing.
      # See CONTRIBUTING.md, "Releasing".
      token: "{{ .Env.WINGET_PKGS_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    # winget-pkgs' own convention for the commit and PR title. The identifier is
    # spelled out rather than templated, because whether the winget pipe exposes
    # .PackageIdentifier as a template variable is not something to discover on a tag.
    commit_msg_template: "New version: Joessst-Dev.fft version {{ .Version }}"

    # The single most important line in this block: an rc tag that opened a PR
    # against microsoft/winget-pkgs would be a moderator's problem, not ours to undo.
    skip_upload: auto

    # `path:` deliberately unset. GoReleaser derives
    # manifests/j/Joessst-Dev/fft/<version>/ from the identifier, which is exactly the
    # layout winget-pkgs requires; setting it by hand is a way to get it wrong.

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    macOS:

    ```sh
    brew install Joessst-Dev/tap/fft
    ```

    Windows:

    ```powershell
    scoop bucket add joessst https://github.com/Joessst-Dev/scoop-bucket
    scoop install fft
    ```

    Anywhere, with Go 1.26+:

    ```sh
    go install github.com/Joessst-Dev/fft-cli/cmd/fft@latest
    ```

    **Full changelog**: https://github.com/Joessst-Dev/fft-cli/compare/{{ .PreviousTag }}...{{ .Tag }}
