name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Create the GitHub Release and upload its artifacts.
      contents: write
      # Mint the OIDC token cosign exchanges for a short-lived signing certificate.
      # This is what makes keyless signing possible: no private key exists to leak.
      id-token: write
      # Push the container images to GHCR. The built-in GITHUB_TOKEN can do this against
      # *this* repo's package registry — unlike the Homebrew tap, no PAT is needed.
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GoReleaser builds the changelog from the commits since the previous tag,
          # so it needs the whole history, not just the tagged commit.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: true

      # Signing and SBOM generation are separate binaries GoReleaser shells out to.
      # Their versions are pinned too, not just the installer actions: this job holds
      # id-token/packages/contents write and the tap PAT, so a compromised upstream
      # release of cosign or syft would run with those. Dependabot does not bump these
      # input pins, so raise them by hand when a new tool release lands.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v3.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.49.0

      # GoReleaser's `dockers_v2` builds the multi-platform image with buildx.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Authenticate to GHCR so GoReleaser can push the images and the manifest. Login
      # must precede GoReleaser — it pushes during `release`, not after.
      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "v2.17.1"
          args: release --clean
        env:
          # The tag that triggered this run — not whatever `git describe` happens to
          # resolve to. Without this, a commit carrying two tags (v0.1.0 and the
          # v0.1.0-rc1 it was cut from, say) is ambiguous: GoReleaser picked the rc,
          # rebuilt the rc's artifacts, and died uploading them over the ones the rc
          # release already had. The triggering ref is the only thing that is never
          # ambiguous.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Creates the release in *this* repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the cask to Joessst-Dev/homebrew-tap. GITHUB_TOKEN cannot do this:
          # it is scoped to this repository only. This must be a PAT with `contents:
          # write` on the tap repo — see README, "Releasing".
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
