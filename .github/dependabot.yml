version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    commit-message:
      # Conventional commits, like every other PR title here. Release notes come
      # from changesets, not from these prefixes, and Dependabot PRs carry none:
      # dependency bumps are not release notes.
      prefix: chore
      include: scope
    groups:
      # One PR for the boring bumps. A patch release of viper does not deserve its
      # own review; a major one does, and majors are deliberately excluded here.
      go-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      # CodeQL ships init/autobuild/analyze as separate actions that MUST run the
      # same version, so they have to move together. This group is listed first and
      # includes major, so a vN->vN+1 bump lands as one PR (the catch-all below
      # excludes majors, which otherwise splits it into one failing PR per action).
      codeql-action:
        patterns: ["github/codeql-action*"]
        update-types: [minor, patch, major]
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The Dockerfile's distroless base is pinned by digest; this keeps that pin fresh.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The VitePress docs toolchain — not shipped in the binary, but still a
  # supply-chain surface the build runs.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # @changesets/cli, the release tooling at the root (package.json). Like the docs
  # toolchain it is not shipped, but the release workflow runs it with write access
  # to the repository.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      release-npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
